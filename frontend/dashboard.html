<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BNI WONDRX 2026 - Dashboard Admin</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome & Boxicons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <!-- DataTables CSS & Responsive Extension CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" />
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.bootstrap5.min.css" />
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css" />

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0b132b, #1c2541, #3a506b);
            color: #f4f5f7;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        .dashboard-header {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px 0;
            margin-bottom: 40px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            max-height: 35px;
            width: auto;
        }

        .dashboard-title {
            font-weight: 700;
            background: linear-gradient(180deg, #FF7C00 0%, #FFA24A 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 0.5px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        /* DataTables Custom Styling */
        .table {
            color: #e2e8f0 !important;
            border-color: rgba(255, 255, 255, 0.08) !important;
            width: 100% !important;
        }

        .table-striped>tbody>tr:nth-of-type(odd)>* {
            background-color: rgba(255, 255, 255, 0.02) !important;
            color: #e2e8f0 !important;
        }

        .table-hover>tbody>tr:hover>* {
            background-color: rgba(255, 255, 255, 0.05) !important;
            color: #ffffff !important;
        }

        thead.table-custom-header th {
            background-color: rgba(255, 124, 0, 0.15) !important;
            color: #FF7C00 !important;
            border-bottom: 2px solid #FF7C00 !important;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            padding: 12px;
        }

        /* Buttons styling */
        .btn-custom-danger {
            background: linear-gradient(135deg, #e63946, #d90429);
            border: none;
            color: white;
            border-radius: 8px;
            padding: 8px 16px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(217, 4, 41, 0.3);
            transition: all 0.2s ease;
        }

        .btn-custom-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(217, 4, 41, 0.4);
            color: white;
        }

        .btn-dt-excel {
            background: linear-gradient(135deg, #2ec4b6, #0f9f90) !important;
            border: none !important;
            color: white !important;
            border-radius: 8px !important;
            padding: 8px 16px !important;
            font-weight: 500 !important;
            box-shadow: 0 4px 15px rgba(46, 196, 182, 0.3) !important;
            transition: all 0.2s ease !important;
        }

        .btn-dt-excel:hover {
            transform: translateY(-2px) !important;
            box-shadow: 0 6px 20px rgba(46, 196, 182, 0.4) !important;
        }

        .dt-buttons {
            margin-bottom: 20px;
        }

        .dataTables_filter input {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #fff !important;
            border-radius: 8px !important;
            padding: 6px 12px !important;
        }

        .dataTables_filter input:focus {
            outline: none;
            border-color: #FF7C00 !important;
            box-shadow: 0 0 0 2px rgba(255, 124, 0, 0.2) !important;
        }

        .dataTables_length select {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #fff !important;
            border-radius: 8px !important;
            padding: 4px 8px !important;
        }

        /* Pagination style */
        .pagination .page-link {
            background: rgba(255, 255, 255, 0.03) !important;
            border-color: rgba(255, 255, 255, 0.08) !important;
            color: #e2e8f0 !important;
        }

        .pagination .page-item.active .page-link {
            background-color: #FF7C00 !important;
            border-color: #FF7C00 !important;
            color: white !important;
        }

        .pagination .page-link:hover {
            background: rgba(255, 124, 0, 0.1) !important;
            color: #FF7C00 !important;
        }

        /* Char Image Styling */
        .char-img-preview {
            max-width: 60px;
            max-height: 60px;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
            transition: all 0.2s ease;
        }

        .char-img-preview:hover {
            transform: scale(1.15);
        }

        /* Modal styling */
        .modal-content {
            background: #1c2541 !important;
            color: #f4f5f7 !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 16px !important;
        }

        .modal-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
        }

        .modal-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.08) !important;
        }

        .modal-title {
            color: #FF7C00;
            font-weight: 600;
        }

        .form-control-custom {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #fff !important;
            border-radius: 10px !important;
        }

        .form-control-custom:focus {
            border-color: #FF7C00 !important;
            box-shadow: 0 0 0 2px rgba(255, 124, 0, 0.2) !important;
        }

        /* Custom Alert styles */
        .swal2-popup {
            background: #1c2541 !important;
            color: #f4f5f7 !important;
            border-radius: 16px !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
        }

        /* DataTables Responsive Child Row Custom Styling */
        table.dataTable.dtr-inline.collapsed>tbody>tr>td.dtr-control::before,
        table.dataTable.dtr-inline.collapsed>tbody>tr>th.dtr-control::before {
            background-color: #FF7C00 !important;
            border: 2px solid #1c2541 !important;
            box-shadow: 0 0 3px rgba(0, 0, 0, 0.4) !important;
        }

        tr.child td.child {
            background: rgba(255, 255, 255, 0.02) !important;
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
            padding: 15px !important;
        }

        ul.dtr-details {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 0;
            margin: 0;
            list-style: none;
        }

        ul.dtr-details li {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 6px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        ul.dtr-details li:last-child {
            border-bottom: none;
        }

        .dtr-title {
            font-weight: 600;
            color: #FF7C00;
        }

        /* Responsive Layout Optimization for Mobile Devices */
        @media (max-width: 767.98px) {
            body {
                padding-bottom: 20px;
            }

            .dashboard-header {
                padding: 15px 0;
                margin-bottom: 20px;
            }

            .header-container {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            .logo-section {
                justify-content: center;
                width: 100%;
            }

            .logo-img {
                max-height: 28px;
            }

            .dashboard-title {
                font-size: 1.25rem;
            }

            .glass-card {
                padding: 16px;
                border-radius: 12px;
            }

            .row.align-items-center {
                display: flex;
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }

            #deleteAllBtn {
                width: 100%;
            }

            .dt-buttons {
                width: 100%;
                display: flex;
                justify-content: center;
                margin-bottom: 15px;
            }

            .btn-dt-excel {
                width: 100% !important;
                text-align: center;
            }

            .dataTables_filter {
                width: 100%;
                text-align: center !important;
                margin-bottom: 15px;
            }

            .dataTables_filter label {
                width: 100%;
            }

            .dataTables_filter input {
                width: 100% !important;
                margin-left: 0 !important;
                margin-top: 5px;
            }

            .dataTables_length {
                text-align: center !important;
                margin-bottom: 15px;
            }

            /* Table formatting on mobile */
            .table {
                font-size: 0.85rem;
            }

            .char-img-preview {
                max-width: 45px;
                max-height: 45px;
            }

            .d-flex.gap-1 {
                flex-direction: column;
                width: 100%;
                gap: 5px !important;
            }

            .d-flex.gap-1 button {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <!-- Header Section -->
    <header class="dashboard-header">
        <div class="container header-container">
            <div class="logo-section">
                <img src="bni.png" alt="BNI Logo" class="logo-img">
                <h1 class="dashboard-title">BNI WONDRX 2026</h1>
            </div>
            <div>
                <a href="/" class="btn btn-outline-light btn-sm rounded-pill px-3">
                    <i class="fa-solid fa-arrow-left me-1"></i> Ke Form Guestbook
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div class="glass-card mb-4">
            <div class="row align-items-center mb-4">
                <div class="col-md-6">
                    <h2 class="h4 mb-0 fw-bold"><i class="fa-solid fa-chart-simple text-warning me-2"></i>Dashboard
                        Guestbook</h2>
                    <p class="text-white-50 mb-0 small">Kelola pesan dan data pengunjung event BNI WondrX 2026.</p>
                </div>
                <div class="col-md-6 text-md-end mt-3 mt-md-0">
                    <button class="btn btn-custom-danger" id="deleteAllBtn">
                        <i class="fa-solid fa-trash-can me-1"></i> Hapus Semua Data
                    </button>
                </div>
            </div>

            <!-- Table -->
            <div class="table-responsive-none">
                <table id="guestbook-table" class="table table-striped table-hover align-middle responsive nowrap"
                    style="width: 100%">
                    <thead class="table-custom-header">
                        <tr>
                            <th style="width: 5%">No</th>
                            <th style="width: 20%">Nama</th>
                            <th style="width: 35%">Komentar</th>
                            <th style="width: 15%">Karakter</th>
                            <th style="width: 15%">Waktu</th>
                            <th style="width: 10%">Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Dinamis dari server -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Edit -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <form id="editForm" class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editModalLabel"><i class="fa-solid fa-pen-to-square me-2"></i>Edit
                        Komentar</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editKey" />
                    <div class="mb-3">
                        <label for="editName" class="form-label small text-white-50">Nama</label>
                        <input type="text" class="form-control form-control-custom" id="editName" required
                            maxlength="15" />
                    </div>
                    <div class="mb-3">
                        <label for="editComment" class="form-label small text-white-50">Komentar</label>
                        <textarea class="form-control form-control-custom" id="editComment" required rows="3"
                            maxlength="80"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary rounded-pill px-4"
                        data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-warning rounded-pill px-4 text-dark fw-bold"
                        style="background-color: #FF7C00; border-color: #FF7C00; color: #fff !important;">
                        Simpan Perubahan
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- jQuery, JSZip, Bootstrap, DataTables & Extensions, SweetAlert2 -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

    <!-- DataTables Responsive Extension JS -->
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js"></script>

    <!-- DataTables Buttons -->
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.bootstrap5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>

    <script>
        $(document).ready(function () {
            // Inisialisasi DataTable dengan Responsive Extension aktif
            let table = $('#guestbook-table').DataTable({
                responsive: true,
                dom: 'Bfrtip',
                buttons: [
                    {
                        extend: 'excelHtml5',
                        text: '<i class="fa-regular fa-file-excel me-1"></i> Export Excel',
                        className: 'btn-dt-excel',
                        exportOptions: {
                            columns: [1, 2, 4] // Hanya export Nama, Komentar, Waktu
                        },
                        title: 'BNI WondrX 2026 - Data Guestbook'
                    }
                ],
                columns: [
                    { data: null }, // Nomor urut
                    { data: 'name' },
                    { data: 'comment' },
                    {
                        data: 'char',
                        render: function (data) {
                            return data ? `<img src="images/${data}.png" class="char-img-preview" alt="Karakter ${data}"/>` : '';
                        }
                    },
                    {
                        data: 'timestamp',
                        render: function (data) {
                            return data ? new Date(data).toLocaleString('id-ID') : '';
                        }
                    },
                    {
                        data: null,
                        orderable: false,
                        render: function (data, type, row) {
                            return `
                                <div class="d-flex gap-1">
                                    <button class="btn btn-sm btn-outline-warning" onclick="showEditModal('${row.key}', '${escapeHtml(row.name)}', '${escapeHtml(row.comment)}')">
                                        <i class="fa-solid fa-pen"></i> Edit
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger" onclick="deleteEntry('${row.key}')">
                                        <i class="fa-solid fa-trash"></i> Hapus
                                    </button>
                                </div>
                            `;
                        }
                    }
                ],
                order: [[4, 'desc']], // Urutkan berdasarkan waktu paling baru
                columnDefs: [
                    {
                        targets: 0,
                        render: function (data, type, row, meta) {
                            return meta.row + 1;
                        },
                        orderable: false
                    }
                ]
            });

            // Helper escape HTML untuk modal edit
            function escapeHtml(text) {
                if (!text) return '';
                return text
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            // Memuat data dari server
            function loadTable() {
                fetch('/entries')
                    .then(res => res.json())
                    .then(data => {
                        let arr = [];
                        if (data) {
                            Object.entries(data).forEach(([key, entry]) => {
                                arr.push({ ...entry, key });
                            });
                        }
                        table.clear().rows.add(arr).draw();
                    })
                    .catch(err => {
                        console.error('Gagal mengambil data:', err);
                        Swal.fire('Error', 'Gagal memuat data dari database', 'error');
                    });
            }

            loadTable();

            // Edit Komentar
            window.showEditModal = function (key, name, comment) {
                $('#editKey').val(key);
                $('#editName').val(name);
                $('#editComment').val(comment);
                var modal = new bootstrap.Modal(document.getElementById('editModal'));
                modal.show();
            }

            $('#editForm').on('submit', function (e) {
                e.preventDefault();
                const key = $('#editKey').val();
                const name = $('#editName').val();
                const comment = $('#editComment').val();

                fetch(`/entries/${key}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, comment })
                })
                    .then(res => res.json())
                    .then(result => {
                        if (result.success) {
                            var modal = bootstrap.Modal.getInstance(document.getElementById('editModal'));
                            modal.hide();

                            // Berikan info jika nama/komentar hasil edit disensor server
                            if (result.censoredName !== name || result.censoredComment !== comment) {
                                Swal.fire({
                                    icon: 'info',
                                    title: 'Disensor Otomatis',
                                    text: 'Perubahan Anda disimpan, namun beberapa kata yang melanggar kebijakan disensor otomatis.',
                                    confirmButtonColor: '#FF7C00'
                                });
                            } else {
                                Swal.fire({
                                    icon: 'success',
                                    title: 'Berhasil',
                                    text: 'Komentar berhasil diupdate!',
                                    timer: 1500,
                                    showConfirmButton: false
                                });
                            }
                            loadTable();
                        } else {
                            Swal.fire('Gagal', 'Gagal memperbarui data', 'error');
                        }
                    })
                    .catch(err => {
                        console.error(err);
                        Swal.fire('Gagal', 'Terjadi kesalahan sistem saat memperbarui data', 'error');
                    });
            });

            // Hapus Satu Komentar
            window.deleteEntry = function (key) {
                Swal.fire({
                    title: 'Apakah Anda yakin?',
                    text: "Data yang dihapus tidak bisa dikembalikan!",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#d33',
                    cancelButtonColor: '#3085d6',
                    confirmButtonText: 'Ya, Hapus!',
                    cancelButtonText: 'Batal'
                }).then((result) => {
                    if (result.isConfirmed) {
                        fetch(`/entries/${key}`, { method: 'DELETE' })
                            .then(res => res.json())
                            .then(result => {
                                if (result.success) {
                                    Swal.fire({
                                        icon: 'success',
                                        title: 'Dihapus!',
                                        text: 'Data berhasil dihapus.',
                                        timer: 1500,
                                        showConfirmButton: false
                                    });
                                    loadTable();
                                } else {
                                    Swal.fire('Gagal', 'Gagal menghapus data', 'error');
                                }
                            })
                            .catch(err => {
                                console.error(err);
                                Swal.fire('Gagal', 'Terjadi kesalahan sistem saat menghapus data', 'error');
                            });
                    }
                });
            }

            // Hapus Semua Komentar
            $('#deleteAllBtn').on('click', function () {
                Swal.fire({
                    title: 'Hapus SEMUA data?',
                    text: "Semua komentar guestbook akan terhapus permanen dari database!",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#d33',
                    cancelButtonColor: '#3085d6',
                    confirmButtonText: 'Ya, Hapus Semua!',
                    cancelButtonText: 'Batal'
                }).then((result) => {
                    if (result.isConfirmed) {
                        fetch('/entries-all', { method: 'DELETE' })
                            .then(res => res.json())
                            .then(result => {
                                if (result.success) {
                                    Swal.fire({
                                        icon: 'success',
                                        title: 'Terhapus!',
                                        text: 'Semua data telah dibersihkan.',
                                        timer: 1500,
                                        showConfirmButton: false
                                    });
                                    loadTable();
                                } else {
                                    Swal.fire('Gagal', 'Gagal membersihkan data', 'error');
                                }
                            })
                            .catch(err => {
                                console.error(err);
                                Swal.fire('Gagal', 'Terjadi kesalahan sistem saat membersihkan data', 'error');
                            });
                    }
                });
            });
        });
    </script>
</body>

</html>
